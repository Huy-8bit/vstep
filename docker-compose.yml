name: vstep-writing-lab
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vstep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vstep_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vstep}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vstep}:${POSTGRES_PASSWORD:-vstep_dev}@postgres:5432/${POSTGRES_DB:-vstep}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
      OPENAI_AUDIO_MODEL: ${OPENAI_AUDIO_MODEL-${OPENAI_SPEAKING_AUDIO_MODEL-gpt-audio}}
      AUDIO_ANALYSIS_ENABLED: ${AUDIO_ANALYSIS_ENABLED:-true}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-alloy}
      QUESTION_IMPORT_STORAGE_DIR: /app/data/question_imports
      AUDIO_STORAGE_DIR: /app/data/audio
      SPEAKING_AUDIO_MAX_MB: ${SPEAKING_AUDIO_MAX_MB:-${MAX_SPEAKING_AUDIO_MB:-20}}
      SPEAKING_AUDIO_MAX_SECONDS: ${SPEAKING_AUDIO_MAX_SECONDS:-${MAX_SPEAKING_AUDIO_SECONDS:-360}}
      AUDIO_FEEDBACK_MIN_CONFIDENCE: ${AUDIO_FEEDBACK_MIN_CONFIDENCE:-${PRONUNCIATION_CONFIDENCE_THRESHOLD:-0.70}}
      OPENAI_GRADING_TEMPERATURE: ${OPENAI_GRADING_TEMPERATURE:-}
      SPEAKING_PART1_SECONDS: ${SPEAKING_PART1_SECONDS:-180}
      SPEAKING_PART2_SECONDS: ${SPEAKING_PART2_SECONDS:-240}
      SPEAKING_PART3_SECONDS: ${SPEAKING_PART3_SECONDS:-300}
      VOCABULARY_REVIEW_DAYS: ${VOCABULARY_REVIEW_DAYS:-1,3,7,14,30}
      WRITING_CALIBRATION_ADMIN_EMAILS: ${WRITING_CALIBRATION_ADMIN_EMAILS:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-2026}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - speaking_audio:/app/data/audio
      - question_imports:/app/data/question_imports
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  speaking_audio:
  question_imports:
