name: vstep-writing-lab
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vstep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vstep_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vstep}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vstep}:${POSTGRES_PASSWORD:-vstep_dev}@postgres:5432/${POSTGRES_DB:-vstep}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_DEFAULT: ${OPENAI_MODEL_DEFAULT:-gpt-5.6-luna}
      OPENAI_MODEL_QUESTION_GENERATION: ${OPENAI_MODEL_QUESTION_GENERATION:-gpt-5.6-luna}
      OPENAI_MODEL_READING_GENERATION: ${OPENAI_MODEL_READING_GENERATION:-gpt-5.6-luna}
      OPENAI_MODEL_QUESTION_QUALITY: ${OPENAI_MODEL_QUESTION_QUALITY:-gpt-5.4-mini-2026-03-17}
      OPENAI_MODEL_WRITING_ANALYSIS: ${OPENAI_MODEL_WRITING_ANALYSIS:-gpt-5.6-luna}
      OPENAI_MODEL_WRITING_SCORING: ${OPENAI_MODEL_WRITING_SCORING:-gpt-5.6-luna}
      OPENAI_MODEL_WRITING_ESCALATION: ${OPENAI_MODEL_WRITING_ESCALATION:-gpt-5.6-terra}
      OPENAI_MODEL_WRITING_CORRECTIONS: ${OPENAI_MODEL_WRITING_CORRECTIONS:-gpt-5.4-mini-2026-03-17}
      OPENAI_MODEL_VOCABULARY: ${OPENAI_MODEL_VOCABULARY:-gpt-5.6-luna}
      OPENAI_MODEL_LEARNING_COACH: ${OPENAI_MODEL_LEARNING_COACH:-gpt-5.6-luna}
      OPENAI_MODEL_EXERCISE_GENERATOR: ${OPENAI_MODEL_EXERCISE_GENERATOR:-gpt-5.6-luna}
      OPENAI_MODEL_SPEAKING_TEXT_GRADING: ${OPENAI_MODEL_SPEAKING_TEXT_GRADING:-gpt-5.4-mini-2026-03-17}
      OPENAI_MODEL_SPEAKING_ESCALATION: ${OPENAI_MODEL_SPEAKING_ESCALATION:-gpt-5.6-terra}
      OPENAI_MODEL_IMPORT: ${OPENAI_MODEL_IMPORT:-gpt-5.4-mini-2026-03-17}
      MODEL_VERSION: ${MODEL_VERSION:-2026-09-19-routing-v2}
      OPENAI_REASONING_OVERRIDES: '${OPENAI_REASONING_OVERRIDES:-{}}'
      OPENAI_PRICE_OVERRIDES: '${OPENAI_PRICE_OVERRIDES:-{}}'
      OPENAI_REASONING_DEFAULT: ${OPENAI_REASONING_DEFAULT:-low}
      OPENAI_REASONING_GRADING: ${OPENAI_REASONING_GRADING:-low}
      OPENAI_REASONING_WRITING: ${OPENAI_REASONING_WRITING:-medium}
      OPENAI_REASONING_ESCALATION: ${OPENAI_REASONING_ESCALATION:-none}
      GRADING_ESCALATION_ENABLED: ${GRADING_ESCALATION_ENABLED:-true}
      GRADING_CONFIDENCE_THRESHOLD: ${GRADING_CONFIDENCE_THRESHOLD:-0.70}
      GRADING_BOUNDARY_CONFIDENCE_THRESHOLD: ${GRADING_BOUNDARY_CONFIDENCE_THRESHOLD:-0.80}
      GRADING_LONG_RESPONSE_WORDS: ${GRADING_LONG_RESPONSE_WORDS:-650}
      GRADING_SHADOW_ENABLED: ${GRADING_SHADOW_ENABLED:-false}
      GRADING_SHADOW_SAMPLE_RATE: ${GRADING_SHADOW_SAMPLE_RATE:-0.05}
      EVAL_OVERALL_MAE_MAX: ${EVAL_OVERALL_MAE_MAX:-0.5}
      EVAL_CRITERION_MAE_MAX: ${EVAL_CRITERION_MAE_MAX:-0.75}
      EVAL_WITHIN_HALF_MIN: ${EVAL_WITHIN_HALF_MIN:-0.70}
      EVAL_WITHIN_ONE_MIN: ${EVAL_WITHIN_ONE_MIN:-0.90}
      EVAL_SERIOUS_OVERSCORE_MAX: ${EVAL_SERIOUS_OVERSCORE_MAX:-0.02}
      EVAL_STRUCTURED_SUCCESS_MIN: ${EVAL_STRUCTURED_SUCCESS_MIN:-0.99}
      EVAL_MIN_SAMPLES: ${EVAL_MIN_SAMPLES:-12}
      AI_COST_ADMIN_EMAILS: ${AI_COST_ADMIN_EMAILS:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
      OPENAI_AUDIO_MODEL: ${OPENAI_AUDIO_MODEL-${OPENAI_SPEAKING_AUDIO_MODEL-gpt-audio}}
      AUDIO_ANALYSIS_ENABLED: ${AUDIO_ANALYSIS_ENABLED:-true}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-alloy}
      QUESTION_IMPORT_STORAGE_DIR: /app/data/question_imports
      AUDIO_STORAGE_DIR: /app/data/audio
      SPEAKING_AUDIO_MAX_MB: ${SPEAKING_AUDIO_MAX_MB:-${MAX_SPEAKING_AUDIO_MB:-20}}
      SPEAKING_AUDIO_MAX_SECONDS: ${SPEAKING_AUDIO_MAX_SECONDS:-${MAX_SPEAKING_AUDIO_SECONDS:-360}}
      AUDIO_FEEDBACK_MIN_CONFIDENCE: ${AUDIO_FEEDBACK_MIN_CONFIDENCE:-${PRONUNCIATION_CONFIDENCE_THRESHOLD:-0.70}}
      OPENAI_GRADING_TEMPERATURE: ${OPENAI_GRADING_TEMPERATURE:-}
      SPEAKING_PART1_SECONDS: ${SPEAKING_PART1_SECONDS:-180}
      SPEAKING_PART2_SECONDS: ${SPEAKING_PART2_SECONDS:-240}
      SPEAKING_PART3_SECONDS: ${SPEAKING_PART3_SECONDS:-300}
      VOCABULARY_REVIEW_DAYS: ${VOCABULARY_REVIEW_DAYS:-1,3,7,14,30}
      LEARNING_OBSERVED_ATTEMPTS: ${LEARNING_OBSERVED_ATTEMPTS:-2}
      LEARNING_RECURRING_ATTEMPTS: ${LEARNING_RECURRING_ATTEMPTS:-3}
      LEARNING_RECENCY_HALF_LIFE_DAYS: ${LEARNING_RECENCY_HALF_LIFE_DAYS:-30}
      LEARNING_TREND_WINDOW: ${LEARNING_TREND_WINDOW:-5}
      LEARNING_TREND_DELTA: ${LEARNING_TREND_DELTA:-0.2}
      LEARNING_MASTERY_EXERCISES: ${LEARNING_MASTERY_EXERCISES:-20}
      LEARNING_MASTERY_SESSIONS: ${LEARNING_MASTERY_SESSIONS:-3}
      LEARNING_MASTERY_REUSES: ${LEARNING_MASTERY_REUSES:-3}
      WRITING_CALIBRATION_ADMIN_EMAILS: ${WRITING_CALIBRATION_ADMIN_EMAILS:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-2026}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - speaking_audio:/app/data/audio
      - question_imports:/app/data/question_imports
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  speaking_audio:
  question_imports:
